<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF_8">
  <meta name="viewport" content="width=device_width, initial_scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
  <div class="container">
    <h1>Weather Dashboard</h1>
    <div class="search_container">
      <input type="text" id="city_input" placeholder="Enter city name" required>
      <button id="search_button">Search</button>
    </div>
    <div id="loading" class="hidden">Loading...</div>
    <div id="weather_display" class="hidden">
      <h2 id="city_name"></h2>
      <p id="temperature"></p>
      <p id="condition"></p>
      <p id="humidity"></p>
      <p id="wind_speed"></p>
    </div>
    <div id="error_message" class="hidden"></div>
    <h3 id="toggle_cities">Previously Searched Cities</h3>
    <ul id="previous_cities" class="hidden"></ul>
  </div>
  <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
